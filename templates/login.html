<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — NovaShift</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><span class="brand-mark">N</span><span>Nova<span class="brand-light">Shift</span></span></a><div class="eyebrow">PRIVATE WORKSPACE</div><h1>Welcome back.</h1><p>Enter your workspace password to continue.</p><form id="login-form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary-btn" type="submit">Sign in <span>→</span></button><div id="login-error" class="notice hidden" role="alert"></div></form></main><script>
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const body=new URLSearchParams({password:document.getElementById('password').value});try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(r.ok&&d.ok)location.href='/';else{const el=document.getElementById('login-error');el.textContent=d.error||'Sign in failed';el.classList.remove('hidden')}}catch{const el=document.getElementById('login-error');el.textContent='Could not connect. Try again.';el.classList.remove('hidden')}});
</script></body></html>
